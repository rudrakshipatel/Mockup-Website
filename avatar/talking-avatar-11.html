<script>
(() => {
  const $ = id => document.getElementById(id);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---------- Eyes ----------
  const eyes = [
    { cx: 557, cy: 414, rx: 53, ry: 56, top: $('lidTopL'), bot: $('lidBotL'), line: $('lidLineL') },
    { cx: 758, cy: 412, rx: 52, ry: 56, top: $('lidTopR'), bot: $('lidBotR'), line: $('lidLineR') }
  ];
  function drawEyes(b) { // b: 0 open → 1 closed
    for (const e of eyes) {
      const topY = e.cy - e.ry - 20, botY = e.cy + e.ry + 12;
      const meet = e.cy + e.ry * 0.3;
      const upper = lerp(topY, meet, b), lower = lerp(botY, meet, b);
      e.top.setAttribute('y', topY);
      e.top.setAttribute('height', Math.max(0, upper - topY));
      e.bot.setAttribute('y', lower);
      e.bot.setAttribute('height', Math.max(0, botY - lower));
      if (b > 0.02) {
        const sag = 14 * b; // closed lid curves gently downward
        e.line.setAttribute('d', `M ${e.cx - e.rx - 6} ${upper} Q ${e.cx} ${upper + sag} ${e.cx + e.rx + 6} ${upper}`);
      } else e.line.setAttribute('d', '');
    }
  }
  let blinkStart = -1, nextBlink = performance.now() + 1200, doubleBlink = false;
  const BLINK_MS = 180;
  function blinkAmount(t) {
    if (blinkStart < 0 && t >= nextBlink) blinkStart = t;
    if (blinkStart < 0) return 0;
    const p = (t - blinkStart) / BLINK_MS;
    if (p >= 1) {
      blinkStart = -1;
      if (!doubleBlink && Math.random() < 0.2) { doubleBlink = true; nextBlink = t + 120; }
      else { doubleBlink = false; nextBlink = t + 2200 + Math.random() * 3000; }
      return 0;
    }
    return Math.sin(p * Math.PI); // close then open
  }

  // Smile from the original drawing: left corner, middle control, right corner.
  const L = { x: 580, y: 549 }, R = { x: 732, y: 546 }, C = { x: 656, y: 589 };
  function drawMouth(open, wide) { // open: 0..1, wide: 0..1 (rounder "o" shapes when low)
    const squeeze = 0; // corners stay put inside the beard
    const lx = L.x + squeeze, rx = R.x - squeeze;
    const upperCtrlY = C.y;
    const lowerCtrlY = C.y + open * 75;
    const upper = `M ${lx} ${L.y} Q ${C.x} ${upperCtrlY} ${rx} ${R.y}`;
    const shape = `${upper} Q ${C.x} ${lowerCtrlY} ${lx} ${L.y} Z`;
    $('mouthFill').setAttribute('d', open > 0.03 ? shape : '');
    $('mouthClipPath').setAttribute('d', shape);
    $('mouthLine').setAttribute('d', open > 0.03 ? shape : upper);
    // Teeth: thin band just under the upper lip
    const tY = (L.y + R.y) / 2;
    $('teeth').setAttribute('d',
      `M ${lx} ${L.y} Q ${C.x} ${upperCtrlY} ${rx} ${R.y} L ${rx} ${R.y + 7} Q ${C.x} ${upperCtrlY + 22} ${lx} ${L.y + 7} Z`);
    $('tongue').setAttribute('cy', lerp(C.y + 20, C.y + 44, open));
    // Dark lower lip (as drawn) drops with the jaw
    const lipY = lerp(595, 608, open);
    $('lowerLip').setAttribute('d',
      `M ${C.x - 28} ${lipY - 1} Q ${C.x + 4} ${lipY + 3} ${C.x + 32} ${lipY - 2} Q ${C.x + 4} ${lipY + 40} ${C.x - 28} ${lipY - 1} Z`);
  }

  // Idle chatter: syllables grouped into words, with short pauses.
  let talking = true, speaking = false;
  let mouth = 0, target = 0, wide = 1, wideTarget = 1, nextSyl = 0, sylLeft = 0;
  function updateTarget(t) {
    if (t < nextSyl) return;
    if (!(talking || speaking)) { target = 0; nextSyl = t + 100; return; }
    if (sylLeft <= 0) {                      // start of a new word (after a pause)
      sylLeft = 2 + Math.floor(Math.random() * 5);
      target = 0; nextSyl = t + (speaking ? 60 : 150 + Math.random() * 350);
      if (!speaking && Math.random() < 0.15) nextSyl += 700; // breath
      return;
    }
    sylLeft--;
    target = 0.25 + Math.random() * 0.75;
    wideTarget = Math.random() < 0.3 ? 0.2 : 1;
    nextSyl = t + 90 + Math.random() * 90;
  }

  // ---------- Loop ----------
  function frame(t) {
    drawEyes(blinkAmount(t));
    updateTarget(t);
    mouth += (target - mouth) * 0.35;
    wide += (wideTarget - wide) * 0.25;
    drawMouth(mouth, wide);
    requestAnimationFrame(frame);
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) talking = false;
  drawMouth(0, 1);
  requestAnimationFrame(frame);

  // ---------- Controls ----------
  $('toggle').onclick = () => {
    talking = !talking;
    $('toggle').textContent = talking ? 'Pause' : 'Talk';
  };
  $('speak').onclick = () => {
    const text = $('text').value.trim();
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.onstart = () => { speaking = true; sylLeft = 0; };
    u.onend = u.onerror = () => { speaking = false; };
    speechSynthesis.speak(u);
  };
})();
</script>
</body>
</html>
